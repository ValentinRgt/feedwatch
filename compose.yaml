services:
  web:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./symfony:/app
    environment:
      APP_ENV: "dev"
      DATABASE_URL: "mysql://feedwatch:feedwatch@mariadb:3306/feedwatch?serverVersion=mariadb-11.0.0"
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    environment:
      - MYSQL_ROOT_PASSWORD=toor
      - MYSQL_DATABASE=feedwatch
      - MYSQL_USER=feedwatch
      - MYSQL_PASSWORD=feedwatch
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./.docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  caddy_data: {}
  caddy_config: {}
  mariadb_data: {}