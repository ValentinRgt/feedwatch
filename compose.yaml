services:
  web:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./symfony:/app
      - .docker/php/php.ini:/usr/local/etc/php/conf.d/feedwatch.ini:ro
    environment:
      APP_ENV: "dev"
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data_%kernel.environment%.db"
    depends_on:
      - mariadb

volumes:
  caddy_data: {}
  caddy_config: {}