name: Update Docker Hub README

on:
  push:
    branches:
      - main
    paths:
      - README.md

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Docker Hub README
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: ${{ vars.DOCKER_HUB_USERNAME }}/feedwatch
          short-description: Self-hosted technology monitoring with RSS feeds, content aggregation and trend tracking
          readme-filepath: ./README.md
